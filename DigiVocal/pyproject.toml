[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digivocal"
version = "0.1.0"
description = "Mandarin articulatory-synthesis research MVP: text to pinyin, gesture trajectories, and synthetic voice."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{name = "DigiVocal project"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pypinyin>=0.55",
  "sounddevice>=0.5",
]

[project.optional-dependencies]
g2pw = ["g2pw>=0.1.1"]
sparc = ["speech-articulatory-coding>=0.1.0"]
gpu-cuda12 = ["cupy-cuda12x[ctk]>=14,<15"]
gpu-cuda13 = ["cupy-cuda13x[ctk]>=14,<15"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
digivocal-gui = "digivocal.gui:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

